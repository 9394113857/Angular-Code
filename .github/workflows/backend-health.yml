# ============================================================
# BACKEND HEALTH CHECK
# ============================================================
#
# PURPOSE
# ------------------------------------------------------------
#
# This workflow checks all deployed backend services:
#
#   1. Flask
#   2. Django
#   3. Java Spring Boot
#   4. ASP.NET Core
#
#
# TRIGGERS
# ------------------------------------------------------------
#
# 1. MANUAL
#
#    GitHub -> Actions -> Backend Health Check -> Run workflow
#
#
# 2. AUTOMATIC DAILY SCHEDULE
#
#    Every day:
#
#      06:00 AM IST
#      07:00 AM IST
#      08:00 AM IST
#      09:00 AM IST
#      10:00 AM IST
#      11:00 AM IST
#      12:00 PM IST
#      01:00 PM IST
#      02:00 PM IST
#      03:00 PM IST
#      04:00 PM IST
#      05:00 PM IST
#      06:00 PM IST
#      07:00 PM IST
#      08:00 PM IST
#      09:00 PM IST
#      10:00 PM IST
#      11:00 PM IST
#
#    PLUS:
#
#      11:55 PM IST
#
#
# IMPORTANT
# ------------------------------------------------------------
#
# GitHub Actions cron uses UTC.
#
# India Standard Time = UTC + 5:30
#
# Therefore:
#
#      06:00 IST = 00:30 UTC
#      07:00 IST = 01:30 UTC
#      08:00 IST = 02:30 UTC
#      ...
#      23:00 IST = 17:30 UTC
#      23:55 IST = 18:25 UTC
#
# ============================================================


name: Backend Health Check


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:


  # ==========================================================
  # MANUAL TRIGGER
  # ==========================================================
  #
  # This allows you to run the workflow whenever you want.
  #
  # GitHub:
  #
  # Actions
  #   ↓
  # Backend Health Check
  #   ↓
  # Run workflow
  #
  # ==========================================================

  workflow_dispatch:


  # ==========================================================
  # DAILY SCHEDULE
  # ==========================================================
  #
  # ALL CRON TIMES BELOW ARE UTC.
  #
  # They correspond to IST times mentioned above.
  #
  # ==========================================================

  schedule:


    # --------------------------------------------------------
    # 06:00 AM IST
    # 00:30 UTC
    # --------------------------------------------------------

    - cron: "30 0 * * *"


    # --------------------------------------------------------
    # 07:00 AM IST
    # 01:30 UTC
    # --------------------------------------------------------

    - cron: "30 1 * * *"


    # --------------------------------------------------------
    # 08:00 AM IST
    # 02:30 UTC
    # --------------------------------------------------------

    - cron: "30 2 * * *"


    # --------------------------------------------------------
    # 09:00 AM IST
    # 03:30 UTC
    # --------------------------------------------------------

    - cron: "30 3 * * *"


    # --------------------------------------------------------
    # 10:00 AM IST
    # 04:30 UTC
    # --------------------------------------------------------

    - cron: "30 4 * * *"


    # --------------------------------------------------------
    # 11:00 AM IST
    # 05:30 UTC
    # --------------------------------------------------------

    - cron: "30 5 * * *"


    # --------------------------------------------------------
    # 12:00 PM IST
    # 06:30 UTC
    # --------------------------------------------------------

    - cron: "30 6 * * *"


    # --------------------------------------------------------
    # 01:00 PM IST
    # 07:30 UTC
    # --------------------------------------------------------

    - cron: "30 7 * * *"


    # --------------------------------------------------------
    # 02:00 PM IST
    # 08:30 UTC
    # --------------------------------------------------------

    - cron: "30 8 * * *"


    # --------------------------------------------------------
    # 03:00 PM IST
    # 09:30 UTC
    # --------------------------------------------------------

    - cron: "30 9 * * *"


    # --------------------------------------------------------
    # 04:00 PM IST
    # 10:30 UTC
    # --------------------------------------------------------

    - cron: "30 10 * * *"


    # --------------------------------------------------------
    # 05:00 PM IST
    # 11:30 UTC
    # --------------------------------------------------------

    - cron: "30 11 * * *"


    # --------------------------------------------------------
    # 06:00 PM IST
    # 12:30 UTC
    # --------------------------------------------------------

    - cron: "30 12 * * *"


    # --------------------------------------------------------
    # 07:00 PM IST
    # 13:30 UTC
    # --------------------------------------------------------

    - cron: "30 13 * * *"


    # --------------------------------------------------------
    # 08:00 PM IST
    # 14:30 UTC
    # --------------------------------------------------------

    - cron: "30 14 * * *"


    # --------------------------------------------------------
    # 09:00 PM IST
    # 15:30 UTC
    # --------------------------------------------------------

    - cron: "30 15 * * *"


    # --------------------------------------------------------
    # 10:00 PM IST
    # 16:30 UTC
    # --------------------------------------------------------

    - cron: "30 16 * * *"


    # --------------------------------------------------------
    # 11:00 PM IST
    # 17:30 UTC
    # --------------------------------------------------------

    - cron: "30 17 * * *"


    # --------------------------------------------------------
    # 11:55 PM IST
    # 18:25 UTC
    # --------------------------------------------------------

    - cron: "25 18 * * *"


# ============================================================
# JOBS
# ============================================================

jobs:


  # ==========================================================
  # HEALTH CHECK JOB
  # ==========================================================

  health-check:


    # --------------------------------------------------------
    # JOB NAME
    # --------------------------------------------------------

    name: Check All Backends


    # --------------------------------------------------------
    # OPERATING SYSTEM
    # --------------------------------------------------------

    runs-on: ubuntu-latest


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # START
      # ======================================================

      - name: Start health check

        run: |

          echo ""
          echo "=============================================="
          echo "       BACKEND HEALTH CHECK STARTED"
          echo "=============================================="

          echo ""

          echo "Current UTC time:"
          date -u

          echo ""

          echo "Current India time:"

          TZ="Asia/Kolkata" date

          echo ""

          echo "=============================================="


      # ======================================================
      # STEP 2
      # FLASK
      # ======================================================

      - name: Check Flask API

        run: |

          echo ""
          echo "=============================================="
          echo "Checking Flask"
          echo "=============================================="

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/flask-response.txt \
            --write-out "%{http_code}" \
            --max-time 30 \
            "https://flask-restapi-tzdm.onrender.com/")


          echo "Flask HTTP Status: $HTTP_STATUS"

          echo ""

          echo "Flask response:"

          cat /tmp/flask-response.txt || true

          echo ""


          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then

            echo "🟢 Flask is UP"

          else

            echo "🔴 Flask is DOWN"

            exit 1

          fi


      # ======================================================
      # STEP 3
      # DJANGO
      # ======================================================

      - name: Check Django API

        run: |

          echo ""
          echo "=============================================="
          echo "Checking Django"
          echo "=============================================="

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/django-response.txt \
            --write-out "%{http_code}" \
            --max-time 30 \
            "https://django-restapi-r7yj.onrender.com/")


          echo "Django HTTP Status: $HTTP_STATUS"

          echo ""

          echo "Django response:"

          cat /tmp/django-response.txt || true

          echo ""


          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then

            echo "🟢 Django is UP"

          else

            echo "🔴 Django is DOWN"

            exit 1

          fi


      # ======================================================
      # STEP 4
      # JAVA
      # ======================================================

      - name: Check Java Spring Boot API

        run: |

          echo ""
          echo "=============================================="
          echo "Checking Java Spring Boot"
          echo "=============================================="

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/java-response.txt \
            --write-out "%{http_code}" \
            --max-time 30 \
            "https://java-springboot-user-backend.onrender.com/api/users")


          echo "Java HTTP Status: $HTTP_STATUS"

          echo ""

          echo "Java response:"

          cat /tmp/java-response.txt || true

          echo ""


          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then

            echo "🟢 Java is UP"

          else

            echo "🔴 Java is DOWN"

            exit 1

          fi


      # ======================================================
      # STEP 5
      # .NET
      # ======================================================

      - name: Check ASP.NET Core API

        run: |

          echo ""
          echo "=============================================="
          echo "Checking ASP.NET Core"
          echo "=============================================="

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/dotnet-response.txt \
            --write-out "%{http_code}" \
            --max-time 30 \
            "https://dotnet-user-service-latest.onrender.com/")


          echo ".NET HTTP Status: $HTTP_STATUS"

          echo ""

          echo ".NET response:"

          cat /tmp/dotnet-response.txt || true

          echo ""


          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then

            echo "🟢 .NET is UP"

          else

            echo "🔴 .NET is DOWN"

            exit 1

          fi


      # ======================================================
      # STEP 6
      # FINAL RESULT
      # ======================================================

      - name: All backends are healthy

        run: |

          echo ""
          echo "=============================================="
          echo "       🟢 ALL BACKENDS ARE UP"
          echo "=============================================="

          echo ""

          echo "Flask  : 🟢 UP"
          echo "Django : 🟢 UP"
          echo "Java   : 🟢 UP"
          echo ".NET   : 🟢 UP"

          echo ""

          echo "Completed at:"

          TZ="Asia/Kolkata" date

          echo ""

          echo "=============================================="