name: 🚀 Wake All 5 Backends + Detect All 5 Databases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-and-detect:
    name: 🔥 5 Servers + 5 Databases — Lightweight Detection
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ============================================================
      # 🚀 INITIALIZE
      # ============================================================

      - name: 🚀 Initialize Runtime Monitor
        shell: bash
        run: |
          set -u

          mkdir -p runtime-results

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║     🚀 5 SERVERS + 5 DATABASES — LIGHTWEIGHT MONITOR       ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║ Trigger       : MANUAL workflow_dispatch                   ║"
          echo "║ Schedule      : NONE                                       ║"
          echo "║ Cron          : NONE                                       ║"
          echo "║ Servers       : 5                                          ║"
          echo "║ Databases     : 5                                          ║"
          echo "║ Total         : 10 components                              ║"
          echo "║ HTTP          : GET ONLY                                   ║"
          echo "║ Data mode     : SMALL / LIGHTWEIGHT HIT                   ║"
          echo "║ Records       : NEVER PRINTED                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          {
            echo "# 🚀 5 Servers + 5 Databases — Lightweight Runtime Monitor"
            echo
            echo "### ⚡ Runtime Status"
            echo
            echo "| # | Backend | 🖥️ Server | 🗄️ Database/Data | HTTP | Data | Records | Time |"
            echo "|---:|---|---|---|---:|---|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 🔥 CHECK ALL FIVE
      # ============================================================

      - name: 🔥 Wake + Detect All 5 Servers and Databases
        shell: bash
        run: |

          set +e

          # ========================================================
          # DEPLOYED BACKENDS
          # ========================================================

          FLASK_BASE="https://flask-restapi-tzdm.onrender.com"
          DJANGO_BASE="https://django-restapi-r7yj.onrender.com"
          FASTAPI_BASE="https://fastapi-rest-api.onrender.com"
          JAVA_BASE="https://java-springboot-user-backend.onrender.com"
          DOTNET_BASE="https://dotnet-user-service-latest.onrender.com"


          # ========================================================
          # EXACT DATA PATHS SUPPLIED
          # ========================================================

          FLASK_PATHS=(
            "/api/mobiles"
            "/mobiles"
            "/api/mobile"
            "/mobile"
          )

          DJANGO_PATHS=(
            "/api/tasks"
          )

          FASTAPI_PATHS=(
            "/mobiles"
            "/api/mobiles"
            "/api/mobile"
            "/mobile"
          )

          JAVA_PATHS=(
            "/api/users"
          )

          DOTNET_PATHS=(
            "/api/users"
            "/users"
            "/api/user"
            "/user"
          )


          # ========================================================
          # LIGHTWEIGHT REQUEST PARAMETERS
          #
          # These are only hints for APIs that support pagination.
          #
          # IMPORTANT:
          # We DO NOT assume these parameters are supported.
          # ========================================================

          LIGHT_QUERY="?limit=1"


          # ========================================================
          # FUNCTION: SERVER CHECK
          #
          # Only checks whether the deployed application responds.
          #
          # No response body is retained.
          # ========================================================

          check_server() {

            BASE="$1"
            OUTPUT="$2"

            TEMP_BODY=$(mktemp)
            TEMP_HEADERS=$(mktemp)

            START=$(date +%s%3N)

            curl \
              --silent \
              --show-error \
              --location \
              --max-time 60 \
              --connect-timeout 15 \
              --request GET \
              --output "$TEMP_BODY" \
              --dump-header "$TEMP_HEADERS" \
              "$BASE/" \
              2>"$OUTPUT.error"

            CURL_CODE=$?

            END=$(date +%s%3N)

            HTTP=$(awk '
              toupper($1) ~ /^HTTP\// { code=$2 }
              END {
                if (code == "") print "000";
                else print code
              }
            ' "$TEMP_HEADERS")

            TIME=$((END - START))


            if [ "$CURL_CODE" -eq 0 ] && \
               [ "$HTTP" -ge 100 ] && \
               [ "$HTTP" -lt 600 ]; then

              STATUS="UP"

            else

              STATUS="DOWN"

            fi


            echo "$STATUS|$HTTP|$TIME" > "$OUTPUT"

            rm -f "$TEMP_BODY"
            rm -f "$TEMP_HEADERS"
          }


          # ========================================================
          # FUNCTION: LIGHTWEIGHT DATABASE/DATA CHECK
          #
          # The endpoint is contacted with:
          #
          #   ?limit=1
          #
          # where supported.
          #
          # We only inspect JSON structure.
          #
          # ACTUAL RECORD CONTENT IS NEVER PRINTED.
          # ========================================================

          check_database() {

            BASE="$1"
            PATHS_NAME="$2"
            OUTPUT="$3"


            case "$PATHS_NAME" in

              FLASK)
                PATHS=("${FLASK_PATHS[@]}")
                ;;

              DJANGO)
                PATHS=("${DJANGO_PATHS[@]}")
                ;;

              FASTAPI)
                PATHS=("${FASTAPI_PATHS[@]}")
                ;;

              JAVA)
                PATHS=("${JAVA_PATHS[@]}")
                ;;

              DOTNET)
                PATHS=("${DOTNET_PATHS[@]}")
                ;;

            esac


            DB_STATUS="DOWN"
            DATA_DETECTED="NO"
            FOUND_PATH="N/A"
            HTTP="000"
            RECORDS="N/A"
            DATA_TIME="0"


            # ------------------------------------------------------
            # Try every configured endpoint until one succeeds.
            # ------------------------------------------------------

            for PATH in "${PATHS[@]}"; do

              URL="${BASE}${PATH}${LIGHT_QUERY}"

              TEMP_BODY=$(mktemp)
              TEMP_HEADERS=$(mktemp)
              TEMP_ERROR=$(mktemp)


              echo "🔎 Lightweight GET: ${PATH}?limit=1"


              START=$(date +%s%3N)


              curl \
                --silent \
                --show-error \
                --location \
                --max-time 60 \
                --connect-timeout 15 \
                --request GET \
                --output "$TEMP_BODY" \
                --dump-header "$TEMP_HEADERS" \
                "$URL" \
                2>"$TEMP_ERROR"


              CURL_CODE=$?


              END=$(date +%s%3N)

              REQUEST_TIME=$((END - START))


              CURRENT_HTTP=$(awk '
                toupper($1) ~ /^HTTP\// { code=$2 }
                END {
                  if (code == "") print "000";
                  else print code
                }
              ' "$TEMP_HEADERS")


              # ----------------------------------------------------
              # Successful HTTP response
              # ----------------------------------------------------

              if [ "$CURL_CODE" -eq 0 ] && \
                 [ "$CURRENT_HTTP" -ge 200 ] && \
                 [ "$CURRENT_HTTP" -lt 300 ]; then


                # --------------------------------------------------
                # Valid JSON
                # --------------------------------------------------

                if jq empty "$TEMP_BODY" >/dev/null 2>&1; then


                  DB_STATUS="UP"
                  DATA_DETECTED="YES"
                  FOUND_PATH="$PATH"
                  HTTP="$CURRENT_HTTP"
                  DATA_TIME="$REQUEST_TIME"


                  # ------------------------------------------------
                  # Detect collection size WITHOUT printing data.
                  #
                  # We only inspect JSON metadata/array length.
                  # ------------------------------------------------

                  RECORDS=$(jq -r '
                    if type == "array" then
                      length

                    elif (.data? | type) == "array" then
                      .data | length

                    elif (.results? | type) == "array" then
                      .results | length

                    elif (.items? | type) == "array" then
                      .items | length

                    elif (.users? | type) == "array" then
                      .users | length

                    elif (.tasks? | type) == "array" then
                      .tasks | length

                    elif (.mobiles? | type) == "array" then
                      .mobiles | length

                    elif (.count? | type) == "number" then
                      .count

                    elif (.total? | type) == "number" then
                      .total

                    elif (.totalElements? | type) == "number" then
                      .totalElements

                    elif (.total_count? | type) == "number" then
                      .total_count

                    else
                      "DATA_DETECTED"
                    end
                  ' "$TEMP_BODY" 2>/dev/null)


                  if [ -z "$RECORDS" ]; then
                    RECORDS="DATA_DETECTED"
                  fi


                  # ------------------------------------------------
                  # IMPORTANT:
                  #
                  # We do NOT print:
                  #
                  #   cat "$TEMP_BODY"
                  #
                  # We do NOT save:
                  #
                  #   "$TEMP_BODY"
                  #
                  # Actual API records remain hidden.
                  # ------------------------------------------------


                  rm -f "$TEMP_BODY"
                  rm -f "$TEMP_HEADERS"
                  rm -f "$TEMP_ERROR"

                  break

                fi

              fi


              rm -f "$TEMP_BODY"
              rm -f "$TEMP_HEADERS"
              rm -f "$TEMP_ERROR"

            done


            echo "$DB_STATUS|$DATA_DETECTED|$FOUND_PATH|$HTTP|$RECORDS|$DATA_TIME" \
              > "$OUTPUT"
          }


          # ========================================================
          # FUNCTION: COMPLETE BACKEND CHECK
          # ========================================================

          check_backend() {

            NUMBER="$1"
            NAME="$2"
            BASE="$3"
            PATHS_NAME="$4"


            SAFE_NAME=$(echo "$PATHS_NAME" | tr '[:upper:]' '[:lower:]')


            SERVER_RESULT="runtime-results/${SAFE_NAME}-server.txt"
            DATABASE_RESULT="runtime-results/${SAFE_NAME}-database.txt"
            JSON_RESULT="runtime-results/${SAFE_NAME}.json"


            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "[$NUMBER/5] 🔥 $NAME"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🌐 $BASE"
            echo "🖥️ Server detection..."
            echo "🗄️ Database/data detection..."
            echo "📦 Lightweight data hit..."


            # ------------------------------------------------------
            # SERVER
            # ------------------------------------------------------

            check_server "$BASE" "$SERVER_RESULT"


            # ------------------------------------------------------
            # DATABASE / DATA
            # ------------------------------------------------------

            check_database \
              "$BASE" \
              "$PATHS_NAME" \
              "$DATABASE_RESULT"


            # ------------------------------------------------------
            # READ SAFE RESULTS
            # ------------------------------------------------------

            IFS='|' read -r \
              SERVER_STATUS \
              SERVER_HTTP \
              SERVER_TIME \
              < "$SERVER_RESULT"


            IFS='|' read -r \
              DB_STATUS \
              DATA_DETECTED \
              FOUND_PATH \
              DB_HTTP \
              RECORDS \
              DB_TIME \
              < "$DATABASE_RESULT"


            # ------------------------------------------------------
            # Server icon
            # ------------------------------------------------------

            if [ "$SERVER_STATUS" = "UP" ]; then
              SERVER_ICON="🟢"
            else
              SERVER_ICON="🔴"
            fi


            # ------------------------------------------------------
            # Database icon
            # ------------------------------------------------------

            if [ "$DB_STATUS" = "UP" ]; then
              DB_ICON="🟢"
            else
              DB_ICON="🔴"
            fi


            # ------------------------------------------------------
            # If server is down, application database cannot be
            # considered reachable through that application.
            # ------------------------------------------------------

            if [ "$SERVER_STATUS" = "DOWN" ]; then

              DB_STATUS="DOWN"
              DB_ICON="🔴"
              DATA_DETECTED="NO"

            fi


            # ------------------------------------------------------
            # Overall status
            # ------------------------------------------------------

            if [ "$SERVER_STATUS" = "UP" ] && \
               [ "$DB_STATUS" = "UP" ]; then

              OVERALL="UP + DATA DETECTED"
              OVERALL_ICON="🟢"

            elif [ "$SERVER_STATUS" = "UP" ] && \
                 [ "$DB_STATUS" = "DOWN" ]; then

              OVERALL="SERVER UP / DATABASE DOWN"
              OVERALL_ICON="🟡"

            else

              OVERALL="SERVER DOWN"
              OVERALL_ICON="🔴"

            fi


            TOTAL_TIME=$((SERVER_TIME + DB_TIME))


            # ======================================================
            # CONSOLE RESULT
            # ======================================================

            echo ""
            echo "┌──────────────────────────────────────────────────────────────┐"
            echo "│ $NAME"
            echo "├──────────────────────────────────────────────────────────────┤"
            echo "│"
            echo "│ 🖥️ SERVER"
            echo "│    Status : $SERVER_ICON $SERVER_STATUS"
            echo "│    HTTP   : $SERVER_HTTP"
            echo "│"
            echo "│ 🗄️ DATABASE / DATA"
            echo "│    Status : $DB_ICON $DB_STATUS"
            echo "│    Data   : $DATA_DETECTED"
            echo "│    HTTP   : $DB_HTTP"
            echo "│    Records: $RECORDS"
            echo "│"
            echo "│ 📡 Endpoint: $FOUND_PATH"
            echo "│ ⚡ Time: ${TOTAL_TIME}ms"
            echo "│"
            echo "│ $OVERALL_ICON $OVERALL"
            echo "│"
            echo "│ 🔒 RECORD CONTENT: HIDDEN"
            echo "└──────────────────────────────────────────────────────────────┘"


            # ======================================================
            # SAFE JSON RESULT
            #
            # NO ACTUAL RECORDS.
            # ======================================================

            cat > "$JSON_RESULT" <<EOF
          {
            "backend": "$NAME",
            "base_url": "$BASE",

            "server": {
              "status": "$SERVER_STATUS",
              "http_status": $SERVER_HTTP,
              "response_time_ms": $SERVER_TIME
            },

            "database": {
              "status": "$DB_STATUS",
              "data_detected": "$DATA_DETECTED",
              "endpoint": "$FOUND_PATH",
              "http_status": $DB_HTTP,
              "record_count_or_metadata": "$RECORDS",
              "response_time_ms": $DB_TIME
            },

            "overall_status": "$OVERALL",

            "request_mode": "LIGHTWEIGHT_GET",
            "response_body": "HIDDEN"
          }
          EOF


            # ======================================================
            # GITHUB SUMMARY ROW
            # ======================================================

            echo "| $NUMBER | **$NAME** | $SERVER_ICON **$SERVER_STATUS** | $DB_ICON **$DB_STATUS** | **$DB_HTTP** | **$DATA_DETECTED** | **$RECORDS** | **${TOTAL_TIME}ms** |" \
              >> "$GITHUB_STEP_SUMMARY"

          }


          # ========================================================
          # 🚀 ALL FIVE RUN IN PARALLEL
          # ========================================================

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                  🚀 STARTING 10 CHECKS                     ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  🖥️ Flask       + 🗄️ Flask DB                              ║"
          echo "║  🖥️ Django      + 🗄️ Django DB                             ║"
          echo "║  🖥️ FastAPI     + 🗄️ FastAPI DB                            ║"
          echo "║  🖥️ Java        + 🗄️ Java DB                               ║"
          echo "║  🖥️ .NET        + 🗄️ .NET DB                              ║"
          echo "║                                                              ║"
          echo "║  📦 LIGHTWEIGHT GET HITS                                    ║"
          echo "║  🔒 RECORD CONTENT NEVER PRINTED                            ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""


          check_backend \
            "1" \
            "Flask / Render" \
            "$FLASK_BASE" \
            "FLASK" &

          PID_FLASK=$!


          check_backend \
            "2" \
            "Django / Render" \
            "$DJANGO_BASE" \
            "DJANGO" &

          PID_DJANGO=$!


          check_backend \
            "3" \
            "FastAPI / Render" \
            "$FASTAPI_BASE" \
            "FASTAPI" &

          PID_FASTAPI=$!


          check_backend \
            "4" \
            "Java Spring Boot / Render" \
            "$JAVA_BASE" \
            "JAVA" &

          PID_JAVA=$!


          check_backend \
            "5" \
            ".NET / Render" \
            "$DOTNET_BASE" \
            "DOTNET" &

          PID_DOTNET=$!


          # ========================================================
          # WAIT FOR ALL FIVE
          # ========================================================

          wait "$PID_FLASK"
          echo "📍 Flask finished."

          wait "$PID_DJANGO"
          echo "📍 Django finished."

          wait "$PID_FASTAPI"
          echo "📍 FastAPI finished."

          wait "$PID_JAVA"
          echo "📍 Java finished."

          wait "$PID_DOTNET"
          echo "📍 .NET finished."


          # ========================================================
          # FINAL CONSOLE
          # ========================================================

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                 🏁 ALL CHECKS FINISHED                     ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  🖥️ 5 SERVERS CHECKED                                      ║"
          echo "║  🗄️ 5 DATABASE/DATA LAYERS CHECKED                         ║"
          echo "║                                                              ║"
          echo "║  📊 TOTAL = 10 COMPONENTS                                  ║"
          echo "║                                                              ║"
          echo "║  📦 Lightweight GET detection completed                     ║"
          echo "║  🔒 Actual records were NOT printed                        ║"
          echo "║  🔒 Actual records were NOT stored                         ║"
          echo "║  🛑 Database writes: NONE                                  ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""


      # ============================================================
      # 📊 FINAL DASHBOARD
      # ============================================================

      - name: 📊 Build Final 10 Component Dashboard
        if: always()
        shell: bash
        run: |

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## 🎯 Final 10-Component Dashboard" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 🖥️ Server + 🗄️ Database Status" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "> 🟢 **SERVER UP** = application returned an HTTP response." \
            >> "$GITHUB_STEP_SUMMARY"

          echo "> 🟢 **DATABASE/DATA UP** = configured data endpoint returned valid JSON." \
            >> "$GITHUB_STEP_SUMMARY"

          echo "> 🟡 **SERVER UP / DATABASE DOWN** = application is alive but data endpoint was not detected." \
            >> "$GITHUB_STEP_SUMMARY"

          echo "> 🔴 **SERVER DOWN** = application could not be reached." \
            >> "$GITHUB_STEP_SUMMARY"

          echo "> 📦 **Lightweight detection** is used to avoid intentionally downloading huge datasets." \
            >> "$GITHUB_STEP_SUMMARY"

          echo "> 🔒 **Actual records are never printed or stored.**" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"


          # ========================================================
          # ARCHITECTURE
          # ========================================================

          echo "### 🧩 Architecture" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          echo "                         MANUAL TRIGGER" >> "$GITHUB_STEP_SUMMARY"
          echo "                               │" >> "$GITHUB_STEP_SUMMARY"
          echo "                               ▼" >> "$GITHUB_STEP_SUMMARY"
          echo "                    GITHUB ACTIONS" >> "$GITHUB_STEP_SUMMARY"
          echo "                               │" >> "$GITHUB_STEP_SUMMARY"
          echo "              ┌────────────────┼────────────────┐" >> "$GITHUB_STEP_SUMMARY"
          echo "              │                │                │" >> "$GITHUB_STEP_SUMMARY"
          echo "              ▼                ▼                ▼" >> "$GITHUB_STEP_SUMMARY"
          echo "           FLASK            DJANGO           FASTAPI" >> "$GITHUB_STEP_SUMMARY"
          echo "              │                │                │" >> "$GITHUB_STEP_SUMMARY"
          echo "              ▼                ▼                ▼" >> "$GITHUB_STEP_SUMMARY"
          echo "           SERVER           SERVER           SERVER" >> "$GITHUB_STEP_SUMMARY"
          echo "              │                │                │" >> "$GITHUB_STEP_SUMMARY"
          echo "              ▼                ▼                ▼" >> "$GITHUB_STEP_SUMMARY"
          echo "          DATABASE         DATABASE         DATABASE" >> "$GITHUB_STEP_SUMMARY"
          echo "              │                │                │" >> "$GITHUB_STEP_SUMMARY"
          echo "              └────────────────┼────────────────┘" >> "$GITHUB_STEP_SUMMARY"
          echo "                               │" >> "$GITHUB_STEP_SUMMARY"
          echo "                     ┌─────────┴─────────┐" >> "$GITHUB_STEP_SUMMARY"
          echo "                     ▼                   ▼" >> "$GITHUB_STEP_SUMMARY"
          echo "                    JAVA                .NET" >> "$GITHUB_STEP_SUMMARY"
          echo "                     │                   │" >> "$GITHUB_STEP_SUMMARY"
          echo "                     ▼                   ▼" >> "$GITHUB_STEP_SUMMARY"
          echo "                   SERVER              SERVER" >> "$GITHUB_STEP_SUMMARY"
          echo "                     │                   │" >> "$GITHUB_STEP_SUMMARY"
          echo "                     ▼                   ▼" >> "$GITHUB_STEP_SUMMARY"
          echo "                  DATABASE            DATABASE" >> "$GITHUB_STEP_SUMMARY"
          echo "                     │                   │" >> "$GITHUB_STEP_SUMMARY"
          echo "                     └─────────┬─────────┘" >> "$GITHUB_STEP_SUMMARY"
          echo "                               │" >> "$GITHUB_STEP_SUMMARY"
          echo "                               ▼" >> "$GITHUB_STEP_SUMMARY"
          echo "                     📊 10 COMPONENTS" >> "$GITHUB_STEP_SUMMARY"
          echo "                               │" >> "$GITHUB_STEP_SUMMARY"
          echo "                               ▼" >> "$GITHUB_STEP_SUMMARY"
          echo "                          🏁 EXIT" >> "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"


          # ========================================================
          # STATUS LEGEND
          # ========================================================

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 🚦 Status Legend" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Status | Meaning |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟢 Server UP | Application responded |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟢 Database UP | Valid JSON data response detected |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟢 Data detected / 0 records | Endpoint is alive but collection is empty |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🟡 Server UP / Database DOWN | Server alive, data endpoint unavailable |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔴 Server DOWN | Application unavailable |" >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 📦 SAFE ARTIFACTS
      # ============================================================

      - name: 📦 Upload Safe Runtime Records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-runtime-detection
          path: runtime-results/
          if-no-files-found: warn
          retention-days: 7


      # ============================================================
      # 🏁 FINAL
      # ============================================================

      - name: 🏁 Final Runtime Report
        if: always()
        shell: bash
        run: |

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                🚀 MONITOR CLOSED                           ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  🖥️ 5 SERVERS                                               ║"
          echo "║  🗄️ 5 DATABASES / DATA LAYERS                               ║"
          echo "║                                                              ║"
          echo "║  📊 TOTAL COMPONENTS: 10                                    ║"
          echo "║                                                              ║"
          echo "║  ⚡ LIGHTWEIGHT DATA DETECTION                              ║"
          echo "║  📦 SMALL GET HIT                                            ║"
          echo "║  🔒 RECORD CONTENT HIDDEN                                   ║"
          echo "║  🛑 NO DATABASE WRITES                                      ║"
          echo "║  📡 GET ONLY                                                ║"
          echo "║  ⏰ MANUAL ONLY                                             ║"
          echo "║                                                              ║"
          echo "║  🏁 CHECK → DETECT → REPORT → EXIT                         ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
